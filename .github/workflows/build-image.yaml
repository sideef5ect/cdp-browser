name: Build Image

# Builds only for a release tag or by hand, never on push to master or pull request.
# release-please tags with GITHUB_TOKEN, and a tag made that way triggers no
# `push: tags` run, so the Release workflow finishing is the trigger: the
# resolve job looks for a vX.Y.Z tag on the commit it ran on.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [master]
  push:
    tags: ['v*.*.*']  # a tag pushed by hand or with a token that triggers workflows
  workflow_dispatch:
    inputs:
      version:
        description: Rebuild a release (e.g. 1.0.0) from the selected ref; leave empty for latest and sha tags only
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    outputs:
      build: ${{ steps.v.outputs.build }}
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Release run: build only if it tagged this commit. Tag push: the tag.
      # Manual run: the optional version input.
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$EVENT" in
            workflow_run) tag=$(git tag --points-at HEAD --list 'v*.*.*' | sort -V | tail -n 1) ;;
            push)         tag="$REF_NAME" ;;
            *)            tag="${INPUT_VERSION:+v${INPUT_VERSION#v}}" ;;
          esac
          if [ "$EVENT" = workflow_run ] && [ -z "$tag" ]; then
            echo "No release tag on $(git rev-parse --short HEAD); nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "build=true"
            echo "version=${tag#v}"
            echo "ref=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${tag:-latest} from $(git rev-parse --short HEAD)"

  build:
    name: Build and push
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Read the commit and ref from the checkout, not the workflow_run event
          context: git
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ needs.resolve.outputs.version != '' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}},value=v${{ needs.resolve.outputs.version }},enable=${{ needs.resolve.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.resolve.outputs.version }},enable=${{ needs.resolve.outputs.version != '' }}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          # No provenance/SBOM child manifests, so the prune step only has the
          # amd64/arm64 children of each multi-arch image to reconcile
          provenance: false
          sbom: false

      # Keep `latest`, version tags and the 4 most recent sha-… tags; delete the
      # rest. `buildcache` is excluded because cache-from/cache-to depend on it.
      - name: Prune old image versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude-tags: latest,buildcache,v*,*.*
          keep-n-tagged: 4
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
