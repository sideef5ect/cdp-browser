name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Ensure only one release workflow runs at a time
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write      # Create releases and tags
  pull-requests: write # Open and update the release PR
  issues: write        # Create labels

jobs:
  # Opens or updates the release PR with GITHUB_TOKEN. Approve and merge it by
  # hand; the run triggered by that merge tags vX.Y.Z and creates the release.
  # Build Image then runs on its own (workflow_run) and publishes the image.
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }}
