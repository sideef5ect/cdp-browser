# Weekly update PRs for the workflow actions, the Python dev environment, and the image's base image.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  # Playwright bumps land in pyproject.toml and uv.lock only; the Lint check then
  # fails until ARG PLAYWRIGHT_VERSION in docker/Dockerfile is bumped in the same PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: build
