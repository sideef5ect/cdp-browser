# Weekly update PRs for the workflow actions, the Python dev environment, and the image's base image.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  # Playwright bumps land in pyproject.toml and uv.lock only; the Lint check then
  # fails until ARG PLAYWRIGHT_VERSION in docker/Dockerfile is bumped in the same PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  # Digest updates only (security patches to ubuntu:22.04). A new Ubuntu release
  # breaks Playwright's install-deps until Playwright supports it, so release
  # jumps such as 22.04 -> 24.04 or 26.04 are ignored and done by hand.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
